<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planish | Find a date together</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar"><a class="wordmark" href="/">Planish<span>.</span></a><a class="text-link" href="/create">Create a plan</a></header>
  <main class="page-shell home-shell">
    <section class="home-intro">
      <p class="eyebrow">Good plans start with a date</p>
      <h1>Get everyone<br>on the same day.</h1>
      <p class="intro">Suggest a few dates, share one link, and find the day that works for your whole group.</p>
      <a href="/create" class="button">Create a plan <span aria-hidden="true">→</span></a>
    </section>
    <section class="join-panel" aria-labelledby="join-heading">
      <p class="eyebrow">Already invited?</p>
      <h2 id="join-heading">Join a plan</h2>
      <form action="/plan" method="GET">
        <label for="plan-id">Plan ID</label>
        <div class="join-row"><input type="text" id="plan-id" name="id" placeholder="Paste the plan ID" required><button type="submit" class="button">Open</button></div>
      </form>
    </section>
  </main>
</body>
</html>
