<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create a plan | Planish</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar"><a class="wordmark" href="/">Planish<span>.</span></a><a class="text-link" href="/">Home</a></header>
  <main class="page-shell narrow-shell">
    <p class="eyebrow">Make a plan</p>
    <h1>When works for everyone?</h1>
    <p class="intro">Add the dates you want your group to choose from.</p>
    <form action="/create" method="POST" class="panel form-panel">
      <label for="name">Plan name</label>
      <input type="text" id="name" name="name" placeholder="Dinner, game night, ..." required>
      <div class="field-heading"><span>Possible dates</span><span class="field-note">Date only, no times</span></div>
      <div id="options" class="date-list"><div class="date-row"><input type="date" name="options" required aria-label="Possible date"></div></div>
      <button type="button" class="button button-secondary" onclick="addOption()">+ Add another date</button>
      <div class="form-actions"><button type="submit" class="button">Create plan</button></div>
    </form>
  </main>
  <script>
    function addOption() {
      const group = document.createElement('div');
      group.className = 'date-row';
      const input = document.createElement('input');
      input.type = 'date';
      input.name = 'options';
      input.required = true;
      input.setAttribute('aria-label', 'Possible date');
      const removeButton = document.createElement('button');
      removeButton.type = 'button';
      removeButton.className = 'icon-button';
      removeButton.textContent = 'Remove';
      removeButton.setAttribute('aria-label', 'Remove date');
      removeButton.onclick = () => group.remove();
      group.append(input, removeButton);
      document.getElementById('options').appendChild(group);
    }
  </script>
</body>
</html>
